<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bismuth Explorer</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/assets/bootstrap.min.css">
<style>
  body{background:#0e1217;color:#e4ebf3}
  .navbar,.card{background:#161b22;border:1px solid #2a323d;color:#e4ebf3}
  a{color:#6cb4ff;text-decoration:none} a:hover{text-decoration:underline}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86rem;word-break:break-all}
  .stat .v{font-size:1.35rem;font-weight:600;color:#fff}
  .l{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:#eef3f9!important;font-weight:600}
  .table{color:#e4ebf3} .table>:not(caption)>*>*{background:transparent;border-color:#2a323d;color:#e4ebf3}
  .table thead th{color:#a7b4c2}
  .badge-coinbase{background:#1f7a49;color:#fff} .hash{color:#bcccdc}
  .spinner{color:#a7b4c2} .form-control{background:#0d1117;border-color:#2a323d;color:#e4ebf3}
  .form-control::placeholder{color:#9aa7b5} .subtle{color:#c2cedb}
  .table-responsive{border-color:#2a323d}
  .trunc{display:inline-block;max-width:48ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
  @media (max-width:576px){
    .navbar .container{flex-wrap:wrap;row-gap:.5rem}
    .navbar-brand{font-size:1.05rem}
    form.d-flex{margin-left:0!important}
    .stat .v{font-size:1.1rem}
    .table-sm{font-size:.82rem}
    .trunc{max-width:14ch}
  }
</style>
</head>
<body>
<nav class="navbar navbar-dark">
  <div class="container py-2">
    <a class="navbar-brand fw-bold" href="#/">⬡ Bismuth Explorer</a>
    <form class="d-flex flex-grow-1 ms-sm-3" onsubmit="return doSearch(event)">
      <input id="q" class="form-control me-2 flex-grow-1" placeholder="block height · block hash · tx signature · address" autocomplete="off">
      <button class="btn btn-primary flex-shrink-0" type="submit">Search</button>
    </form>
  </div>
</nav>

<div class="container pt-2">
  <div class="subtle small">
    <a href="#/blocks/">Blocks</a> &middot; <a href="#/tokens">Tokens</a> &middot;
    <a href="#/nodes">Nodes</a> &middot; <a href="#/vm">Contracts</a> &middot; <a href="#/supply">Supply</a>
    &middot; <a href="#/api">API</a>
    &middot; <a href="javascript:void(0)" onclick="var u=prompt('Node API base (e.g. http://127.0.0.1:5659 for your local node):','http://127.0.0.1:5659');if(u)connectNode(u);">connect node…</a>
  </div>
  <div id="nodebar" class="pt-2"></div>
</div>
<div class="container py-3">
  <div id="status" class="row g-2 mb-3"></div>
  <div id="main"></div>
  <p class="text-center mt-4 subtle">Live data from the Bismuth node REST API · <b style="color:#9be29b">bright v3</b> · <a href="https://bismuth.cz">bismuth.cz</a></p>
</div>

<script>
let API = localStorage.getItem('bisnode') || '/api';
const el=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
async function api(p){
  // If this page is served over https but the chosen node is http, the browser blocks a direct fetch
  // (mixed content). Route through THIS explorer's own same-origin node (/api/proxy), which relays the
  // request to the target node server-side (node->node http, no browser policy). Otherwise fetch direct.
  const url=mixedContent()?('/api/proxy?target='+encodeURIComponent(API+p)):(API+p);
  const r=await fetch(url);if(!r.ok)throw new Error(r.status+' '+p);return r.json();}
function connectNode(host){host=String(host||'').replace(/\/+$/,'');API=host?host+'/api':'/api';
  if(host)localStorage.setItem('bisnode',API);else localStorage.removeItem('bisnode');
  // Land on the node overview WITHOUT leaving an #/at/<url> entry behind: rewrite the hash in place
  // (no extra history step, no double router() — the old code set hash='#/' AND called router(), which
  // double-fetched and made Back re-connect the peer). replaceState doesn't fire hashchange, so we
  // render once, here.
  if(location.hash&&location.hash!=='#/')history.replaceState(null,'',location.pathname+location.search+'#/');
  refreshStatus();router();}
function resetNode(){connectNode('');}
function mixedContent(){return location.protocol==='https:'&&/^http:\/\//i.test(API);}
function nodeBanner(){const b=document.getElementById('nodebar');if(!b)return;
  if(API==='/api'){b.innerHTML='';return;}
  const relay=mixedContent()?' <span class="badge bg-secondary" title="The browser can\'t fetch an http node from an https page, so requests are relayed server-side through this explorer\'s own node.">relayed via this explorer\'s node</span>':'';
  b.innerHTML=`<div class="alert alert-info py-1 mb-2 small">Browsing node <span class="mono">${esc(API)}</span> · <a href="javascript:resetNode()">back to this explorer's node</a>${relay}</div>`;}
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short=(h,n=16)=>{h=String(h||'');return h.length>n?h.slice(0,n)+'…':h;};
const tm=(ts)=>{const d=new Date(parseFloat(ts)*1000);return isNaN(d)?'-':d.toLocaleString();};
const ago=(ts)=>{let s=Math.max(0,Date.now()/1000-parseFloat(ts));if(s<60)return Math.floor(s)+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';return Math.floor(s/3600)+'h ago';};
function fmtAmt(a){let n=parseFloat(a);if(!isFinite(n))return esc(a);let s=n.toFixed(8).replace(/\.?0+$/,'');return s===''?'0':s;}
function setMain(h){const m=document.getElementById('main');m.innerHTML='';m.append(typeof h==='string'?el(h):h);}
function loading(){setMain('<div class="text-center py-5 spinner">Loading…</div>');}
function errBox(e){let extra='';
  if(API!=='/api'){extra=`<hr class="my-2"><div class="small">Could not reach <span class="mono">${esc(API)}</span>${mixedContent()?' via this explorer\'s relay — the target node may be offline, or this explorer\'s own node is too old to relay (it needs rest_api.py with the /api/proxy endpoint).':' — it may be offline or not expose its REST API.'} <a href="javascript:resetNode()">back to this explorer\'s node</a></div>`;}
  setMain(`<div class="alert alert-danger">Not found / error: ${esc(e.message||e)}${extra}</div>`);}

let TIP=0;
async function refreshStatus(){
  try{const s=await api('/status');TIP=s.blocks;
    const cards=[['Height',s.blocks],['Difficulty',Number(s.difficulty).toFixed(8)],
      ['Peers',s.connections],['Consensus',s.consensus===s.blocks?'100%':s.consensus],
      ['Protocol',s.protocol],['Node',s.node_version]];
    document.getElementById('status').innerHTML=cards.map(([l,v])=>
      `<div class="col"><div class="card stat p-2"><div class="l">${l}</div><div class="v">${esc(v)}</div></div></div>`).join('');
  }catch(e){const r=(API!=='/api')?` · <a href="javascript:resetNode()">back to this explorer's node</a>`:'';
    document.getElementById('status').innerHTML=`<div class="col"><div class="alert alert-warning mb-0">node API unreachable${r}</div></div>`;}
}

const PAGE=20;
async function blocksList(end){
  loading();
  try{
    if(!end){const s=await api('/status');end=s.blocks;}
    end=Math.max(1,parseInt(end));
    const start=Math.max(1,end-PAGE+1);
    const h=await api(`/headers/range/${start}/${end}`);
    const rows=(h.headers||[]).slice().reverse().map(b=>`<tr>
      <td><a href="#/block/${b.block_height}">${b.block_height}</a></td>
      <td class="mono hash"><a class="trunc" title="${esc(b.block_hash)}" href="#/block/${esc(b.block_hash)}">${short(b.block_hash,24)}</a></td>
      <td>${b.txs}</td><td title="${tm(b.timestamp)}">${ago(b.timestamp)}</td></tr>`).join('');
    const newer=end<TIP?`<a class="btn btn-sm btn-outline-info" href="#/blocks/${Math.min(TIP,end+PAGE)}">‹ Newer</a>`:'<span></span>';
    const older=start>1?`<a class="btn btn-sm btn-outline-info" href="#/blocks/${start-1}">Older ›</a>`:'<span></span>';
    setMain(`<div class="card p-3"><div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="mb-0">Blocks ${start}–${end}</h5><a class="btn btn-sm btn-outline-secondary" href="#/blocks/">⟳ Latest</a></div>
      <div class="table-responsive"><table class="table table-sm align-middle"><thead><tr><th>Height</th><th>Hash</th><th>Txs</th><th>Age</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
      <div class="d-flex justify-content-between">${newer}${older}</div></div>`);
  }catch(e){errBox(e);}
}

function txTable(txs){
  return `<div class="table-responsive"><table class="table table-sm align-middle"><thead><tr><th>From</th><th>To</th><th>Amount</th><th>Op</th><th>Signature (txid)</th></tr></thead><tbody>${
    txs.map(t=>{const cb=(t.address===t.recipient&&parseFloat(t.reward||0)>0);
      return `<tr>
        <td class="mono"><a class="trunc" title="${esc(t.address)}" href="#/address/${esc(t.address)}">${short(t.address,16)}</a></td>
        <td class="mono"><a class="trunc" title="${esc(t.recipient)}" href="#/address/${esc(t.recipient)}">${short(t.recipient,16)}</a> ${cb?'<span class="badge badge-coinbase">coinbase</span>':''}</td>
        <td>${fmtAmt(t.amount)}${parseFloat(t.reward||0)>0?` <span class="hash">+${fmtAmt(t.reward)}</span>`:''}</td>
        <td>${esc(t.operation||'')}</td>
        <td class="mono hash"><a class="trunc" title="${esc(t.txid||t.signature||'')}" href="#/tx/${encodeURIComponent(t.txid||String(t.signature||'').slice(0,56))}">${short(t.txid||t.signature,20)}</a></td></tr>`;}).join('')
  }</tbody></table></div>`;
}

async function showBlock(id){
  loading();
  try{
    const isH=/^\d+$/.test(id);
    const b=await api(isH?`/block/height/${id}`:`/block/hash/${id}`);
    const txs=b.transactions||[];const hh=txs[0]||{};
    setMain(`<div class="card p-3">
      <h5>Block ${esc(b.block_height)}</h5>
      <div class="row mono mb-2"><div class="col-md-8"><span class="l">hash</span><br>${esc(hh.block_hash||'')}</div>
      <div class="col-md-4"><span class="l">time</span><br>${tm(hh.timestamp)}</div></div>
      <div class="mb-3">
        <a class="btn btn-sm btn-outline-secondary" href="#/block/${(+b.block_height)-1}">‹ prev</a>
        <a class="btn btn-sm btn-outline-secondary" href="#/block/${(+b.block_height)+1}">next ›</a>
        <a class="btn btn-sm btn-outline-secondary" href="#/blocks/${b.block_height}">in list</a>
        <span class="ms-2 subtle">${txs.length} transaction(s)</span></div>
      ${txTable(txs)}</div>`);
  }catch(e){errBox(e);}
}

async function showTx(txid){
  loading();
  try{const t=await api(`/transaction/${encodeURIComponent(txid)}`);
    const f=(l,v,m)=>`<div class="mb-2"><div class="l">${l}</div><div class="${m?'mono':''}">${v}</div></div>`;
    setMain(`<div class="card p-3"><h5>Transaction</h5>
      ${f('txid',esc(t.txid||txid),1)}
      ${t.signature?f('signature',esc(t.signature),1):''}
      ${f('block',`<a href="#/block/${esc(t.block_height)}">${esc(t.block_height)}</a>`)}
      ${f('time',tm(t.timestamp))}
      ${f('from',`<a href="#/address/${esc(t.address)}">${esc(t.address)}</a>`,1)}
      ${f('to',`<a href="#/address/${esc(t.recipient)}">${esc(t.recipient)}</a>`,1)}
      ${f('amount',fmtAmt(t.amount)+' BIS')}${f('fee',fmtAmt(t.fee)+' BIS')}
      ${t.openfield?f('openfield',esc(t.openfield),1):''}</div>`);
  }catch(e){errBox(e);}
}

async function showAddress(addr,limit){
  loading();limit=limit||25;
  try{
    const bal=await api(`/balance/${encodeURIComponent(addr)}`);
    let txs=[];try{const r=await api(`/address/${encodeURIComponent(addr)}/transactions?limit=${limit}`);txs=r.transactions||r||[];}catch(_){}
    const more=(txs.length===limit&&limit<500)?`<div class="text-center"><a class="btn btn-sm btn-outline-info" href="#/address/${esc(addr)}/${Math.min(500,limit+25)}">Load more ↓</a></div>`:'';
    setMain(`<div class="card p-3"><h5>Address</h5>
      <div class="mono mb-1">${esc(addr)}</div>
      <div class="subtle small mb-3">A Bismuth address — the SHA‑224 hash of the owner's public key (56 hex chars). Not a transaction; it identifies a wallet.</div>
      <div class="stat mb-3"><span class="l">balance</span><div class="v">${fmtAmt(bal.balance)} BIS</div></div>
      ${txs.length?`<h6>Transactions (newest ${txs.length}${txs.length>=500?', capped at 500':''})</h6>${txTable(txs)}${more}`:'<p class="subtle">No transactions for this address.</p>'}</div>`);
  }catch(e){errBox(e);}
}

async function tokensList(){
  loading();
  try{const d=await api('/tokens');
    const rows=(d.tokens||[]).map(t=>`<tr>
      <td><a href="#/token/${encodeURIComponent(t.token)}">${esc(t.token)}</a></td>
      <td>${t.transfers}</td></tr>`).join('');
    setMain(`<div class="card p-3"><h5>Tokens <span class="subtle small">(${d.count})</span></h5>
      ${d.count?`<div class="table-responsive"><table class="table table-sm align-middle"><thead><tr><th>Token</th><th>Transfers</th></tr></thead><tbody>${rows}</tbody></table></div>`
        :'<p class="subtle">No tokens issued on this chain yet.</p>'}</div>`);
  }catch(e){errBox(e);}
}
async function showToken(name){
  loading();
  try{const d=await api(`/token/${encodeURIComponent(name)}`);
    const rows=(d.holders||[]).map(h=>`<tr>
      <td class="mono"><a class="trunc" title="${esc(h.address)}" href="#/address/${esc(h.address)}">${short(h.address,28)}</a></td>
      <td>${Number(h.balance).toLocaleString()}</td></tr>`).join('');
    setMain(`<div class="card p-3"><h5>Token <span class="mono">${esc(d.token)}</span></h5>
      <div class="row g-2 mb-3">
        <div class="col"><div class="card stat p-2"><div class="l">supply</div><div class="v">${Number(d.supply).toLocaleString()}</div></div></div>
        <div class="col"><div class="card stat p-2"><div class="l">holders</div><div class="v">${d.holder_count}</div></div></div>
        <div class="col"><div class="card stat p-2"><div class="l">transfers</div><div class="v">${d.transfers}</div></div></div></div>
      <h6>Holders</h6>
      <div class="table-responsive"><table class="table table-sm align-middle"><thead><tr><th>Address</th><th>Balance</th></tr></thead><tbody>${rows}</tbody></table></div></div>`);
  }catch(e){errBox(e);}
}
// Strip a trailing :port so a peer keyed "host:5658" (live connection) and "host" (known/reputation) are
// the same node. Leaves IPv6 (multiple colons) and bare hosts untouched.
function nodeHost(ip){const s=String(ip||'');const m=s.match(/^([^:]+):\d+$/);return m?m[1]:s;}
async function nodesList(){
  loading();
  try{const d=await api('/nodes');
    // Defensive merge by host: older nodes (and relayed ones) may still return the un-deduped list where
    // every connected peer appears twice — once as host:port (connected, blank) and once as host (known,
    // with version/height/reputation). Fold them into one row so the Version etc. always shows.
    const by={};
    (d.nodes||[]).forEach(n=>{const h=nodeHost(n.ip);const e=by[h]||(by[h]={ip:h,height:null,behind:null,version:null,reputation:0,connected:false,banned:false,whitelisted:false});
      if(n.height!=null)e.height=n.height;
      if(n.behind!=null)e.behind=n.behind;
      if(n.version!=null)e.version=n.version;
      if(n.connected)e.connected=true; if(n.banned)e.banned=true; if(n.whitelisted)e.whitelisted=true;
      if(Math.abs(n.reputation||0)>Math.abs(e.reputation||0))e.reputation=n.reputation||0;});
    const nodes=Object.values(by).sort((a,b)=>(b.connected-a.connected)||((b.reputation||0)-(a.reputation||0))||((b.height||0)-(a.height||0)));
    const badge=(n)=>n.banned?'<span class="badge bg-danger">banned</span>'
      :n.connected?'<span class="badge badge-coinbase">connected</span>':'<span class="badge bg-secondary">known</span>';
    const rows=nodes.map(n=>`<tr>
      <td class="mono"><a href="#/at/${encodeURIComponent('http://'+n.ip+':5659')}" title="browse this node's API">${esc(n.ip)}</a>${n.whitelisted?' <span class="badge bg-info">wl</span>':''}</td>
      <td>${n.height==null?'-':n.height}</td>
      <td>${n.behind==null?'-':(n.behind===0?'tip':('−'+n.behind))}</td>
      <td class="mono">${esc(n.version||'-')}</td><td>${n.reputation}</td><td>${badge(n)}</td></tr>`).join('');
    setMain(`<div class="card p-3"><h5>Network <span class="subtle small">(${nodes.length} nodes · consensus ${esc(d.consensus==null?'-':d.consensus)})</span></h5>
      ${nodes.length?`<div class="table-responsive"><table class="table table-sm align-middle"><thead><tr><th>Node</th><th>Height</th><th>Δ</th><th>Version</th><th>Reputation</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`
        :'<p class="subtle">No peers visible right now.</p>'}
      <p class="subtle small mt-2">Reputation rewards peers whose blocks validate and penalizes height-lies / invalid blocks; the agreed tip and deep-rollback recovery weight by it. Click a node to browse its API.</p></div>`);
  }catch(e){errBox(e);}
}
async function apiView(){
  loading();
  try{
    const idx=await api('/');                       // self-describing index (trailing slash: matches nginx's `location /api/` and the relay's /api path guard)
    let st=null; try{st=await api('/status');}catch(_){}
    const eps=idx.endpoints||{};
    const items=Object.keys(eps).map(k=>{const isPost=/^POST\s/i.test(k);const path=k.replace(/^POST\s+/i,'');
      const param=/[{}]/.test(path);return {method:isPost?'POST':'GET',path,rel:path.replace(/^\/api/,''),run:(!isPost&&!param),desc:eps[k]};});
    const dur=(s)=>{s=parseInt(s)||0;const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d?d+'d '+h+'h':h?h+'h '+m+'m':m+'m';};
    const meta=`<div class="card p-3 mb-3">
      <div class="d-flex justify-content-between align-items-start flex-wrap" style="gap:.5rem">
        <div><h5 class="mb-1">${esc(idx.name||'Bismuth REST API')}</h5>
          <div class="subtle small">REST API v${esc(idx.version||'?')} · node ${esc(idx.node_version||'?')} · protocol <span class="mono">${esc(idx.protocol||'?')}</span></div></div>
        <div class="mono small subtle">${esc(API)}</div></div>
      ${idx.transport?`<div class="subtle small mt-2">${esc(idx.transport)}</div>`:''}</div>`;
    const grid=st?`<div class="row g-2 mb-3">`+[['Height',st.blocks],['Difficulty',Number(st.difficulty).toFixed(4)],['Peers',st.connections],['Consensus',st.consensus===st.blocks?'100%':st.consensus],['Uptime',dur(st.uptime)],['Threads',st.threads]].map(([l,v])=>`<div class="col"><div class="card stat p-2"><div class="l">${l}</div><div class="v">${esc(v)}</div></div></div>`).join('')+`</div>`:'';
    const rows=items.map((it,i)=>`<tr>
      <td><span class="badge ${it.method==='POST'?'bg-warning text-dark':'bg-info text-dark'}">${it.method}</span></td>
      <td class="mono">${esc(it.path)}</td>
      <td class="subtle small">${esc(it.desc)}</td>
      <td class="text-end">${it.run?`<button class="btn btn-sm btn-outline-info py-0" data-i="${i}">run ▸</button>`:''}</td></tr>
      ${it.run?`<tr id="ao-${i}" style="display:none"><td></td><td colspan="3"><pre class="mono small mb-0" style="white-space:pre-wrap;max-height:340px;overflow:auto;background:#0d1117;padding:.5rem;border:1px solid #2a323d;border-radius:4px"></pre></td></tr>`:''}`).join('');
    // NB: setMain()->el() keeps only the FIRST top-level node, so everything must live under ONE root div
    // (meta + status grid + endpoints table were 3 siblings, which silently dropped all but the meta).
    setMain(`<div>${meta}${grid}
      <div class="card p-3"><h5 class="mb-1">API endpoints <span class="subtle small">(${items.length})</span></h5>
        <div class="subtle small mb-2">Self-describing, live from <span class="mono">${esc(API)}</span>. GET endpoints without {parameters} can be run inline${mixedContent()?" (relayed through this explorer's node)":''}.</div>
        <div class="table-responsive"><table class="table table-sm align-middle"><thead><tr><th>Method</th><th>Path</th><th>Description</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div></div>`);
    document.querySelectorAll('#main button[data-i]').forEach(btn=>btn.addEventListener('click',async()=>{
      const i=btn.getAttribute('data-i'),it=items[+i],out=document.getElementById('ao-'+i),pre=out.querySelector('pre');
      if(out.style.display!=='none'){out.style.display='none';btn.textContent='run ▸';return;}
      out.style.display='';btn.textContent='running…';btn.disabled=true;
      try{const data=await api(it.rel);pre.textContent=JSON.stringify(data,null,2);}
      catch(e){pre.textContent='Error: '+(e.message||e);}
      finally{btn.disabled=false;btn.textContent='hide ▾';}}));
  }catch(e){errBox(e);}
}
async function supplyView(){
  loading();
  try{const d=await api('/supply');
    if(d.circulating==null){
      setMain('<div class="card p-3"><h5>Supply</h5><p class="subtle py-3">Computing circulating supply from the ledger… (first load only).</p></div>');
      if((location.hash||'').indexOf('supply')>=0)setTimeout(supplyView,3000);
      return;
    }
    setMain(`<div class="card p-3"><h5>Supply</h5>
      <div class="row g-2">
        <div class="col-md-6"><div class="card stat p-3"><div class="l">circulating supply</div><div class="v">${Number(d.circulating).toLocaleString(undefined,{maximumFractionDigits:2})} BIS</div></div></div>
        <div class="col-md-6"><div class="card stat p-3"><div class="l">chain height</div><div class="v">${Number(d.height).toLocaleString()}</div></div></div></div>
      <p class="subtle small mt-3">Circulating supply = total mining emission (rewards minus fees) plus the concluded dev / Hypernode rewards, summed from the ledger.</p></div>`);
  }catch(e){errBox(e);}
}
async function vmList(){
  loading();
  try{const d=await api('/vm/contracts');
    if(!d.enabled){setMain(`<div class="card p-3"><h5>Contracts</h5><p class="subtle py-3">The decentralized-apps VM is not enabled on this node${d.fork_height?'':' (or hf2 has not activated yet)'} — contracts execute post-fork.</p></div>`);return;}
    const rows=(d.contracts||[]).map(a=>`<tr><td class="mono"><a class="trunc" title="${esc(a)}" href="#/vm/${esc(a)}">${short(a,40)}</a></td></tr>`).join('');
    setMain(`<div class="card p-3"><h5>Contracts <span class="subtle small">(${d.count||0}${d.fork_height?' · hf2 @ '+d.fork_height:''})</span></h5>
      ${d.count?`<div class="table-responsive"><table class="table table-sm align-middle"><thead><tr><th>Contract address</th></tr></thead><tbody>${rows}</tbody></table></div>`
        :'<p class="subtle">No contracts deployed yet.</p>'}
      <p class="subtle small mt-2">Deterministic VM: deploy with a <span class="mono">vm:deploy</span> tx (bytecode), call with <span class="mono">vm:call</span>. Supports Bitcoin-style HTLC primitives (SHA256 + block-height timelock) for trustless atomic swaps.</p></div>`);
  }catch(e){setMain('<div class="card p-3"><h5>Contracts</h5><p class="subtle py-3">This node does not expose the VM API (it predates the contract layer).</p></div>');}
}
async function vmContract(addr){
  loading();
  try{const d=await api('/vm/contract/'+encodeURIComponent(addr));
    const rows=(d.storage||[]).map(s=>`<tr><td class="mono">${esc(s.key)}</td><td class="mono">${esc(s.value)}</td></tr>`).join('');
    setMain(`<div class="card p-3"><h5>Contract</h5><div class="mono mb-2">${esc(d.address)}</div>
      <div class="row g-2 mb-3">
        <div class="col"><div class="card stat p-2"><div class="l">code size</div><div class="v">${d.code_size} B</div></div></div>
        <div class="col"><div class="card stat p-2"><div class="l">storage slots</div><div class="v">${d.slots}</div></div></div></div>
      <h6>Storage</h6>${d.slots?`<div class="table-responsive"><table class="table table-sm align-middle"><thead><tr><th>Key</th><th>Value</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<p class="subtle">No storage set.</p>'}
      <h6 class="mt-3">Bytecode</h6><div class="mono hash" style="word-break:break-all">${esc(d.code)}</div></div>`);
  }catch(e){errBox(e);}
}
function doSearch(ev){ev.preventDefault();const q=document.getElementById('q').value.trim();if(!q)return false;
  if(/^\d+$/.test(q))location.hash=`#/block/${q}`;
  else if(/^[0-9a-fA-F]{56}$/.test(q))location.hash=`#/hashlookup/${q}`;
  else location.hash=`#/tx/${encodeURIComponent(q)}`;
  return false;}
async function hashLookup(x){loading();try{await api(`/block/hash/${x}`);location.hash=`#/block/${x}`;}catch(_){location.hash=`#/address/${x}`;}}

function router(){
  const p=(location.hash||'#/').slice(1).split('/').filter(Boolean);
  nodeBanner();
  if(p[0]==='at')return connectNode(decodeURIComponent(p[1]));
  if(p[0]==='block')return showBlock(decodeURIComponent(p[1]));
  if(p[0]==='blocks')return blocksList(p[1]);
  if(p[0]==='tx')return showTx(decodeURIComponent(p.slice(1).join('/')));
  if(p[0]==='address')return showAddress(decodeURIComponent(p[1]),p[2]?parseInt(p[2]):0);
  if(p[0]==='tokens')return tokensList();
  if(p[0]==='token')return showToken(decodeURIComponent(p[1]));
  if(p[0]==='nodes')return nodesList();
  if(p[0]==='api')return apiView();
  if(p[0]==='supply')return supplyView();
  if(p[0]==='vm'&&p[1])return vmContract(decodeURIComponent(p[1]));
  if(p[0]==='vm')return vmList();
  if(p[0]==='hashlookup')return hashLookup(p[1]);
  return blocksList();
}
window.addEventListener('hashchange',router);
refreshStatus();router();
setInterval(refreshStatus,15000);
</script>
</body>
