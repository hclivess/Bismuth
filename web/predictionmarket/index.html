<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bismuth Prediction Market</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/assets/bootstrap.min.css">
<style>
  body{background:#0e1217;color:#e4ebf3}
  .navbar,.card{background:#161b22;border:1px solid #2a323d;color:#e4ebf3}
  a{color:#6cb4ff;text-decoration:none} a:hover{text-decoration:underline}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86rem;word-break:break-all}
  .stat .v{font-size:1.35rem;font-weight:600;color:#fff}
  .l{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:#eef3f9!important;font-weight:600}
  .table{color:#e4ebf3} .table>:not(caption)>*>*{background:transparent;border-color:#2a323d;color:#e4ebf3}
  .table thead th{color:#a7b4c2}
  .subtle{color:#c2cedb} .table-responsive{border-color:#2a323d}
  .form-control,.form-select{background:#0d1117;border-color:#2a323d;color:#e4ebf3}
  .form-control::placeholder{color:#9aa7b5}
  .trunc{display:inline-block;max-width:46ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
  .yes{color:#4ad991} .no{color:#ff6b7d}
  .btn-yes{background:#1f7a49;border-color:#1f7a49;color:#fff} .btn-yes:hover{background:#239056;color:#fff}
  .btn-no{background:#8f2d3a;border-color:#8f2d3a;color:#fff} .btn-no:hover{background:#a8333f;color:#fff}
  .oddsbar{height:14px;border-radius:7px;overflow:hidden;background:#8f2d3a;display:flex}
  .oddsbar>.y{background:#1f7a49;height:100%}
  .pill{font-size:.72rem;padding:.18rem .5rem;border-radius:1rem;font-weight:600}
  .pill-open{background:#1f3a5a;color:#9fd0ff} .pill-yes{background:#16633c;color:#bdf3d6} .pill-no{background:#6e2530;color:#ffc7ce}
  #toast{position:fixed;right:1rem;bottom:1rem;z-index:9;max-width:90vw}
  @media (max-width:576px){
    .navbar .container{flex-wrap:wrap;row-gap:.5rem}
    .stat .v{font-size:1.1rem} .trunc{max-width:18ch} .table-sm{font-size:.82rem}
  }
</style>
</head>
<body>
<nav class="navbar navbar-dark">
  <div class="container py-2">
    <a class="navbar-brand fw-bold" href="#">&#x2B21; Bismuth Prediction Market</a>
    <span class="subtle small ms-auto" id="netstat">connecting…</span>
  </div>
</nav>

<div class="container py-3">

  <!-- connection / config -->
  <div class="card p-3 mb-3">
    <div class="row g-2 align-items-end">
      <div class="col-12 col-md-4">
        <label class="l">Node REST API (read)</label>
        <input id="cfgApi" class="form-control form-control-sm" placeholder="http://127.0.0.1:3031">
      </div>
      <div class="col-12 col-md-4">
        <label class="l">Signing relay (write)</label>
        <input id="cfgRelay" class="form-control form-control-sm" placeholder="http://127.0.0.1:8099">
      </div>
      <div class="col-8 col-md-3">
        <label class="l">Market contract address</label>
        <input id="cfgAddr" class="form-control form-control-sm mono" placeholder="56-hex contract address">
      </div>
      <div class="col-4 col-md-1 d-grid">
        <button class="btn btn-sm btn-primary" onclick="connectAll()">Load</button>
      </div>
    </div>
    <div id="walletline" class="subtle small mt-2"></div>
  </div>

  <div id="main"></div>

  <p class="text-center mt-4 subtle small">
    Live state from the node's read-only REST API · writes signed by your local relay ·
    a Polymarket-style binary market as one RISC-V contract on Bismuth.
  </p>
</div>

<div id="toast"></div>

<script>
let API   = localStorage.getItem('pm_api')   || 'http://127.0.0.1:3031';
let RELAY = localStorage.getItem('pm_relay') || 'http://127.0.0.1:8099';
let ADDR  = localStorage.getItem('pm_addr')  || '';
let WALLET = null, RESOLVER_ID = null, POLL = null;

const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short=(h,n=18)=>{h=String(h||'');return h.length>n?h.slice(0,n)+'…':h;};
const el=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
function setMain(h){const m=document.getElementById('main');m.innerHTML='';m.append(typeof h==='string'?el(h):h);}
const UNIT=100000000;
const bis=(units)=>(Number(units)/UNIT).toLocaleString(undefined,{maximumFractionDigits:8});

function toast(msg,kind){const t=document.getElementById('toast');
  const n=el(`<div class="alert alert-${kind||'info'} py-2 px-3 shadow">${esc(msg)}</div>`);
  t.append(n);setTimeout(()=>n.remove(),5200);}

async function getJSON(base,path){const r=await fetch(base+path);if(!r.ok){let d='';try{d=(await r.json()).detail||'';}catch(_){}throw new Error(r.status+' '+(d||path));}return r.json();}
async function postJSON(base,path,body){const r=await fetch(base+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||(r.status+' '+path));return j;}

// --- question text is OFF-CHAIN (the contract holds only pools/pot/outcome) so we keep it locally,
//     keyed by contract address, like a label. Anyone can set their own; it is purely presentational.
function qkey(a){return 'pm_q_'+a;}
function getQuestion(a){return localStorage.getItem(qkey(a))||'';}
function setQuestion(a,q){if(q)localStorage.setItem(qkey(a),q);}

function saveCfg(){localStorage.setItem('pm_api',API);localStorage.setItem('pm_relay',RELAY);localStorage.setItem('pm_addr',ADDR);}

async function refreshWallet(){
  document.getElementById('walletline').innerHTML='';
  try{const info=await getJSON(RELAY,'/relay/info');WALLET=info.address;RESOLVER_ID=info.resolver_id;
    document.getElementById('walletline').innerHTML=
      `Relay wallet <span class="mono">${esc(WALLET)}</span> · its resolver-id <span class="mono">${RESOLVER_ID}</span> ·
       <a href="javascript:doDeploy()">deploy a new market with this wallet as resolver</a>`;
  }catch(e){WALLET=null;RESOLVER_ID=null;
    document.getElementById('walletline').innerHTML=
      `<span class="text-warning">Signing relay not reachable at <span class="mono">${esc(RELAY)}</span></span> —
       reads still work; start <span class="mono">relay.py</span> to buy/resolve/claim.`;}
}

async function refreshNet(){
  try{const s=await getJSON(API,'/status?compress=none');
    document.getElementById('netstat').textContent=`${s.protocol} · height ${s.blocks}`;
    return s;
  }catch(e){document.getElementById('netstat').textContent='node unreachable';throw e;}
}

function oddsBar(yes,no){const y=(yes||0),n=(no||0),t=y+n;const yp=t?(100*y/t):50;
  return `<div class="oddsbar mb-1" title="${yp.toFixed(1)}% YES"><div class="y" style="width:${yp}%"></div></div>`;}

async function render(){
  if(!ADDR){
    setMain(`<div class="card p-4 text-center">
      <h5 class="mb-2">No market loaded</h5>
      <p class="subtle">Paste a market contract address above and press <b>Load</b>, or
      ${RELAY?'<a href="javascript:doDeploy()">deploy a fresh market</a>':'start the relay and deploy one'}.</p>
      <p class="subtle small mb-0">A market is one deployed RISC-V contract; its address is the 56-hex VM address.</p>
    </div>`);return;
  }
  let m;
  try{m=await getJSON(API,'/vm/market/'+encodeURIComponent(ADDR)+'?compress=none');}
  catch(e){setMain(`<div class="alert alert-danger">Could not read market <span class="mono">${esc(ADDR)}</span>: ${esc(e.message)}<br>
    <span class="small">Is the address a deployed contract on this node? Is the VM fork active?</span></div>`);return;}

  const yesU=Number(m.yes_pot), noU=Number(m.no_pot), potU=Number(m.pot);
  const resolved=m.resolved, outcome=m.outcome;
  const q=getQuestion(ADDR)||'(untitled market — set a question below)';
  const statusPill=resolved
    ? (outcome===1?'<span class="pill pill-yes">RESOLVED · YES won</span>':'<span class="pill pill-no">RESOLVED · NO won</span>')
    : '<span class="pill pill-open">OPEN</span>';
  const isResolver=(WALLET!=null);   // any relay wallet may TRY; the contract enforces resolver-only on chain

  const buyCard=resolved?'':`
    <div class="card p-3 mb-3">
      <div class="l mb-2">Buy shares — deposit BIS to back an outcome</div>
      <div class="row g-2 align-items-end">
        <div class="col-12 col-sm-4">
          <label class="l">Amount (BIS)</label>
          <input id="buyAmt" type="number" min="0" step="0.01" value="1" class="form-control form-control-sm">
        </div>
        <div class="col-6 col-sm-4 d-grid">
          <button class="btn btn-yes btn-sm" onclick="doBuy('yes')" ${WALLET?'':'disabled'}>Buy YES</button>
        </div>
        <div class="col-6 col-sm-4 d-grid">
          <button class="btn btn-no btn-sm" onclick="doBuy('no')" ${WALLET?'':'disabled'}>Buy NO</button>
        </div>
      </div>
      ${WALLET?'':'<div class="subtle small mt-2">Connect the signing relay to buy.</div>'}
    </div>`;

  const resolveCard=resolved?'':`
    <div class="card p-3 mb-3">
      <div class="l mb-2">Resolve — settle the outcome (resolver only; enforced on chain)</div>
      <div class="row g-2 align-items-end">
        <div class="col-12 col-sm-7">
          <select id="resOutcome" class="form-select form-select-sm">
            <option value="1">Outcome: YES wins</option>
            <option value="2">Outcome: NO wins</option>
          </select>
        </div>
        <div class="col-12 col-sm-5 d-grid">
          <button class="btn btn-outline-warning btn-sm" onclick="doResolve()" ${isResolver?'':'disabled'}>Settle market</button>
        </div>
      </div>
      <div class="subtle small mt-2">Your relay wallet's resolver-id is <span class="mono">${RESOLVER_ID==null?'—':RESOLVER_ID}</span>;
        the contract only accepts the settle from the resolver baked in at deploy.</div>
    </div>`;

  const claimCard=!resolved?'':`
    <div class="card p-3 mb-3">
      <div class="l mb-2">Claim — winners redeem a pro-rata share of the whole pot</div>
      <div class="row g-2 align-items-end">
        <div class="col-12 col-sm-8">
          <label class="l">Pay winnings to (56-hex address)</label>
          <input id="claimTo" class="form-control form-control-sm mono" value="${esc(WALLET||'')}" placeholder="recipient address">
        </div>
        <div class="col-12 col-sm-4 d-grid">
          <button class="btn btn-success btn-sm" onclick="doClaim()" ${WALLET?'':'disabled'}>Claim winnings</button>
        </div>
      </div>
      <div class="subtle small mt-2">Claims pay the caller's winning-side stake × (total pot ÷ winning pot).
        Losers and non-stakers get nothing; each winner can claim once. Remaining claimable pot:
        <b>${bis(potU)} BIS</b>.</div>
    </div>`;

  setMain(`
    <div class="card p-3 mb-3">
      <div class="d-flex justify-content-between align-items-start">
        <h5 class="mb-1" style="max-width:80%">${esc(q)}</h5>${statusPill}
      </div>
      <div class="mono subtle small mb-3">${esc(ADDR)}</div>

      ${oddsBar(yesU,noU)}
      <div class="d-flex justify-content-between small mb-3">
        <span class="yes">YES ${m.yes_odds}%</span><span class="no">${m.no_odds}% NO</span>
      </div>

      <div class="row g-2">
        <div class="col-6 col-md-3"><div class="card stat p-2"><div class="l">YES pool</div><div class="v yes">${bis(yesU)}</div></div></div>
        <div class="col-6 col-md-3"><div class="card stat p-2"><div class="l">NO pool</div><div class="v no">${bis(noU)}</div></div></div>
        <div class="col-6 col-md-3"><div class="card stat p-2"><div class="l">Pot (custody)</div><div class="v">${bis(potU)}</div></div></div>
        <div class="col-6 col-md-3"><div class="card stat p-2"><div class="l">Status</div><div class="v">${resolved?(outcome===1?'YES':'NO'):'Open'}</div></div></div>
      </div>
    </div>

    ${buyCard}${resolveCard}${claimCard}

    <div class="card p-3">
      <div class="l mb-2">Market question (off-chain label — the contract stores only pools/outcome)</div>
      <div class="input-group input-group-sm">
        <input id="qInput" class="form-control" placeholder="e.g. Will BTC close above \$100k on Jan 1?" value="${esc(getQuestion(ADDR))}">
        <button class="btn btn-outline-secondary" onclick="saveQ()">Save label</button>
      </div>
    </div>
  `);
}

function saveQ(){const q=document.getElementById('qInput').value.trim();setQuestion(ADDR,q);toast('Saved question label','success');render();}

async function maybeMine(txid,what){
  // On regnet the relay can mine for us so the demo confirms instantly. Try it; ignore if not regnet.
  try{await postJSON(RELAY,'/relay/mine',{count:2});}catch(_){}
  toast(`${what} submitted (txid ${short(txid,12)}) — confirming…`,'success');
  setTimeout(render,600);
}

async function doDeploy(){
  if(!WALLET){toast('Start the signing relay first','warning');return;}
  const q=prompt('Market question (optional label):','Will it rain tomorrow?');
  try{const r=await postJSON(RELAY,'/relay/deploy',{});
    // find the new contract: poll the contract list for one that appeared
    toast('Deploy submitted; mining + locating contract…','info');
    await postJSON(RELAY,'/relay/mine',{count:2}).catch(()=>{});
    const before=new Set();   // we simply take the newest contract whose market slots are empty
    const list=await getJSON(API,'/vm/contracts?compress=none');
    // the freshest deploy is ours; pick the contract not equal to current ADDR with all-zero pools
    let pick=null;
    for(const a of (list.contracts||[])){
      try{const mk=await getJSON(API,'/vm/market/'+a+'?compress=none');
        if(Number(mk.yes_pot)===0&&Number(mk.no_pot)===0&&!mk.resolved)pick=a;}catch(_){}
    }
    if(pick){ADDR=pick;if(q)setQuestion(ADDR,q);saveCfg();document.getElementById('cfgAddr').value=ADDR;
      toast('Market deployed: '+short(ADDR,16),'success');render();}
    else toast('Deployed (txid '+short(r.txid,12)+'); set the address manually once mined','warning');
  }catch(e){toast('Deploy failed: '+e.message,'danger');}
}

async function doBuy(side){
  const amt=parseFloat(document.getElementById('buyAmt').value);
  if(!(amt>0)){toast('Enter an amount > 0','warning');return;}
  try{const r=await postJSON(RELAY,'/relay/buy',{address:ADDR,side:side,bis:amt});
    maybeMine(r.txid,`Buy ${side.toUpperCase()} ${amt} BIS`);
  }catch(e){toast('Buy failed: '+e.message,'danger');}
}

async function doResolve(){
  const outcome=parseInt(document.getElementById('resOutcome').value);
  try{const r=await postJSON(RELAY,'/relay/resolve',{address:ADDR,outcome:outcome});
    maybeMine(r.txid,`Resolve ${outcome===1?'YES':'NO'}`);
  }catch(e){toast('Resolve failed: '+e.message,'danger');}
}

async function doClaim(){
  const to=document.getElementById('claimTo').value.trim();
  try{const r=await postJSON(RELAY,'/relay/claim',{address:ADDR,recipient:to});
    maybeMine(r.txid,'Claim');
  }catch(e){toast('Claim failed: '+e.message,'danger');}
}

function connectAll(){
  API=document.getElementById('cfgApi').value.trim().replace(/\/+$/,'')||API;
  RELAY=document.getElementById('cfgRelay').value.trim().replace(/\/+$/,'')||RELAY;
  ADDR=document.getElementById('cfgAddr').value.trim()||'';
  saveCfg();start();
}

function startPoll(){if(POLL)clearInterval(POLL);POLL=setInterval(()=>{refreshNet().catch(()=>{});if(ADDR)render();},5000);}

async function start(){
  document.getElementById('cfgApi').value=API;
  document.getElementById('cfgRelay').value=RELAY;
  document.getElementById('cfgAddr').value=ADDR;
  await refreshNet().catch(()=>{});
  await refreshWallet();
  await render();
  startPoll();
}
start();
</script>
</body>
</html>
